name: Update price image

on:
  schedule:
    # Tomorrow's prices are published around 14:00 Finnish time.
    # Cron uses UTC: 13/14/15 UTC = 15/16/17 in winter (EET), 16/17/18 in summer (EEST).
    # 18 UTC is an extra run in case the earlier ones are delayed or fail.
    - cron: "5 13,14,15,18 * * *"
  workflow_dispatch:        # "Run workflow" button for manual runs
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # never stop a deployment halfway

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core   # fallback only; Inter is in render/fonts
          pip install -r requirements.txt

      - name: Test
        run: python -m pytest -q

      - name: Render
        run: python render/render.py --out-dir out

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
