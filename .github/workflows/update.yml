name: Update price image

on:
  schedule:
    # Tomorrow's prices are published around 14:00 Finnish time.
    # GitHub delays scheduled runs under load and sometimes drops them, so run
    # every hour in the afternoon/evening, at an unpopular minute (not :00/:05).
    # Cron uses UTC: 12-19 UTC = 14:23-21:23 in winter (EET), 15:23-22:23 in summer.
    # Every run renders the full set, so extra runs are harmless.
    - cron: "23 12-19 * * *"
  workflow_dispatch:        # "Run workflow" button for manual runs
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # never stop a deployment halfway

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core   # fallback only; Inter is in render/fonts
          pip install -r requirements.txt

      - name: Test
        run: python -m pytest -q

      - name: Render
        run: python render/render.py --out-dir out

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
